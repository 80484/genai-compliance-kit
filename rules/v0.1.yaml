# ============================================================
# 生成式 AI 合规自查 · 规则库 v0.1
# ------------------------------------------------------------
# 用途：把现行规范拆成可判定的检查项，供 skill / workflow 调用
# 维护：人工整理，逐条核对官方原文；新增条款走 PR 式复核
# 声明：quote 字段为原文摘录或要点概括，正式对外使用前
#       须对照官方发布文本逐字核对（见 sources.md 官方链接）
# ------------------------------------------------------------
# 角色代码
#   A 模型提供者    自研模型，直接或经 API 对外提供生成服务
#   B 应用提供者    调用他人模型，做成产品对外提供
#   C 传播平台      提供内容发布与传播服务
#   D 分发平台      应用商店、小程序平台等
# 判定状态（只允许这四种）
#   符合 / 不符合 / 不适用 / 待核
# 风险等级（按"不整改的法律后果"分档，不按"看着严重"分档）
#   high   可导致不予备案、下架，或存在明确罚则的行政处罚
#   medium 法定义务但无直接罚则，检查中易被要求整改
#   low    形式补正即可，不产生直接法律后果
# ============================================================

meta:
  version: 0.1.0
  updated: 2026-11-25
  scope: 中国大陆境内、面向公众提供生成式 AI 服务
  out_of_scope:
    - 仅内部研发/自用、不向境内公众提供
    - 境外提供服务（另行适用 GDPR / EU AI Act 等）
  item_count: 23
  domains:
    - 主体与准入
    - 训练数据
    - 内容安全
    - 标识与透明度
    - 个人信息与用户权益
    - 服务运营

rules:

# ============================================================
# 域一 · 主体与准入
# ============================================================

- id: GEN-01
  title: 适用范围与角色认定
  domain: 主体与准入
  roles: [A, B, C, D]
  risk: high
  trigger: 任何拟上线产品
  question: >
    该产品是否利用生成式人工智能技术，向中华人民共和国境内公众
    提供生成文本、图片、音频、视频等内容的服务？若是，属于哪几种角色？
  pass_criteria: >
    已明确回答"是否向境内公众提供"，并完成角色认定（A/B/C/D 可多选），
    且角色认定有事实支撑（模型来源、是否自建社区、是否在应用商店分发）。
  evidence_required:
    - 产品定位与用户范围说明
    - 模型来源（自研 / 采购 API / 开源微调）
    - 是否存在用户内容发布功能
    - 分发渠道清单
  on_fail: 停止后续判定，先完成适用范围与角色认定；角色不清会导致全部结论失效
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第2条
      quote_type: 原文
      quote: >
        利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、
        视频等内容的服务（以下称生成式人工智能服务），适用本办法。
        行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等研发、
        应用生成式人工智能技术，未向境内公众提供生成式人工智能服务的，
        不适用本办法的规定。
      effective_from: 2023-08-15
  pitfalls:
    - 把"内部试用"当成"不适用"，但只要有外部用户可访问入口即可能构成"向公众提供"
    - 只认定 B，忽略产品内嵌的社区功能使其同时构成 C
  notes: 本条是分流闸门，不产生"符合/不符合"，只产出角色标签

- id: GEN-02
  title: 安全评估
  domain: 主体与准入
  roles: [A, B]
  risk: high
  trigger: 具有舆论属性或者社会动员能力的生成式 AI 服务；或开发上线具有舆论属性或社会动员能力的新产品、新应用、新功能
  question: 是否已按国家有关规定开展安全评估，并留存评估报告？
  pass_criteria: 有安全评估报告，覆盖内容安全、数据安全、算法机制机理，且评估时点晚于最近一次重大功能变更
  evidence_required:
    - 安全评估报告（含评估范围、方法、结论）
    - 评估机构/团队与评估时间
  on_fail: 上线前完成安全评估；未评估不得对外提供服务
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第17条
      quote_type: 原文
      quote: 提供具有舆论属性或者社会动员能力的生成式人工智能服务的，应当按照国家有关规定开展安全评估，并按照《互联网信息服务算法推荐管理规定》履行算法备案和变更、注销备案手续。
      effective_from: 2023-08-15
    - law: 互联网信息服务深度合成管理规定
      article: 第20条
      quote_type: 原文
      quote: 深度合成服务提供者开发上线具有舆论属性或者社会动员能力的新产品、新应用、新功能的，应当按照国家有关规定开展安全评估。
      effective_from: 2023-01-10
  pitfalls:
    - 把"算法自评估报告"当成"安全评估报告"，二者材料与口径不同
    - 功能大改后未重新评估

- id: GEN-03
  title: 算法备案
  domain: 主体与准入
  roles: [A, B]
  risk: high
  trigger: 具有舆论属性或者社会动员能力的生成式 AI / 深度合成服务提供者
  question: 是否通过互联网信息服务算法备案系统完成算法备案，并在信息变更、终止服务时办理变更或注销？
  pass_criteria: 有有效备案编号；备案主体名称、服务名称、算法类型与实际一致；变更事项已在十个工作日内办理
  evidence_required:
    - 算法备案编号
    - 备案系统公示页截图
    - 《落实算法安全主体责任基本情况》
    - 《算法安全自评估报告》
  on_fail: 立即启动备案（实务周期约 2–3 个月）；未完成不得对外提供服务
  legal_basis:
    - law: 互联网信息服务算法推荐管理规定
      article: 第24条
      quote_type: 原文
      quote: >
        具有舆论属性或者社会动员能力的算法推荐服务提供者应当在提供服务之日起
        十个工作日内通过互联网信息服务算法备案系统填报服务提供者的名称、服务形式、
        应用领域、算法类型、算法自评估报告、拟公示内容等信息，履行备案手续。
      effective_from: 2022-03-01
    - law: 生成式人工智能服务管理暂行办法
      article: 第17条
      quote_type: 原文
      quote: 提供具有舆论属性或者社会动员能力的生成式人工智能服务的，应当按照国家有关规定开展安全评估，并按照《互联网信息服务算法推荐管理规定》履行算法备案和变更、注销备案手续。
      effective_from: 2023-08-15
    - law: 互联网信息服务深度合成管理规定
      article: 第19条
      quote_type: 原文
      quote: >
        具有舆论属性或者社会动员能力的深度合成服务提供者，应当按照
        《互联网信息服务算法推荐管理规定》履行备案和变更、注销备案手续。
        深度合成服务技术支持者应当参照前款规定履行备案和变更、注销备案手续。
      effective_from: 2023-01-10
  pitfalls:
    - 认为"调用第三方模型就不用备案"——提供服务的仍是自己
    - 只备案算法，未同步准备用户协议与实名注册机制
    - 应用商店/小程序平台要求上线前提供备案号，导致无法按期上线

- id: GEN-04
  title: 大模型备案或登记
  domain: 主体与准入
  roles: [A]
  risk: high
  trigger: 以自己名义对外提供生成式人工智能（大语言模型）服务
  question: 是否已通过属地省级网信办完成大模型备案或登记？
  pass_criteria: 有备案/登记回执；备案主体与服务名称一致；材料为按实际情况编写而非套用模板
  evidence_required:
    - 生成式人工智能（大语言模型）上线备案表
    - 安全评估报告（含测试题库与测试结果）
    - 模型服务协议（用户协议 + 隐私政策）
    - 语料标注规则
    - 拦截关键词列表
    - 芯片/算力国产化替代方案（如适用）
  on_fail: 上线前完成备案（实务周期约 6–8 个月），预留排期
  legal_basis:
    - law: 监管实务口径（各地方网信办公告）
      article: 大模型备案/登记要求
      quote_type: 概括
      quote: >
        《暂行办法》仅明确算法备案；"大模型备案/登记"由各地方网信办通过公告
        等方式落地。备案需经省级与中央网信办双重审核，登记仅需属地网信办审核。
        材料要求与流程由各地具体掌握，口径持续变化。
      effective_from: 2023-08-15
  pitfalls:
    - 把实务口径写成法定要求（报告须标注来源与不确定性）
    - 机械套用他人材料，被认定真实性/独立性不足
    - 备案后未准备应对抽检测试
  notes: 本条为实务概念，不是单一法条；报告中必须标注"实务口径，非直接法定条文"

- id: GEN-05
  title: 备案编号公示
  domain: 主体与准入
  roles: [A, B]
  risk: low
  trigger: 已完成算法备案
  question: 是否在网站、应用程序的显著位置标明备案编号，并提供公示信息链接？
  pass_criteria: 首页/关于页/设置页可见备案编号，链接可跳转至备案系统公示页
  evidence_required:
    - 产品内公示位置截图
    - 链接可访问性验证
  on_fail: 在显著位置补充备案编号与公示链接
  legal_basis:
    - law: 互联网信息服务深度合成管理规定
      article: 第19条第3款
      quote_type: 原文
      quote: 完成备案的深度合成服务提供者和技术支持者应当在其对外提供服务的网站、应用程序等的显著位置标明其备案编号并提供公示信息链接。
      effective_from: 2023-01-10
  pitfalls:
    - 备了案但产品里找不到编号（高频漏项）
    - 只写编号不给链接，或链接指向首页而非公示页

# ============================================================
# 域二 · 训练数据
# ============================================================

- id: GEN-06
  title: 训练数据来源合法性
  domain: 训练数据
  roles: [A]
  risk: high
  trigger: 自行开展预训练、优化训练
  question: 训练数据与基础模型是否具有合法来源，且可追溯？
  pass_criteria: >
    每一类数据源（自有、采购、公开爬取、开源数据集、用户数据）均有来源说明与
    权利依据；采购有合同，开源有许可证，爬取有 robots 与网站条款合规性说明
  evidence_required:
    - 数据来源清单（类型 / 体量 / 获取方式 / 权利依据）
    - 采购合同或授权文件
    - 开源数据集许可证清单
    - 爬取行为的合规说明
  on_fail: 剔除来源不明数据；无法追溯的部分不得用于训练
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第7条第1项
      quote_type: 原文
      quote: 使用具有合法来源的数据和基础模型。
      effective_from: 2023-08-15
  pitfalls:
    - 只写"数据来自公开互联网"，不等于合法来源
    - 基础模型本身来源不明（如二次分发权重）

- id: GEN-07
  title: 训练数据知识产权
  domain: 训练数据
  roles: [A]
  risk: medium
  trigger: 训练语料中包含受著作权保护的作品
  question: 是否存在侵害他人知识产权的风险，采取了哪些措施？
  pass_criteria: 有版权筛查机制、通知删除通道、必要的授权或合理使用论证
  evidence_required:
    - 版权过滤规则与执行记录
    - 授权文件（如有）
    - 侵权投诉处理流程
  on_fail: 建立版权筛查与投诉响应机制；高风险语料下线
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第7条第2项
      quote_type: 原文
      quote: 涉及知识产权的，不得侵害他人依法享有的知识产权。
      effective_from: 2023-08-15
  pitfalls:
    - 认为"训练属于合理使用"即无需任何措施
    - 忽略输出端复现训练语料导致的侵权

- id: GEN-08
  title: 训练数据中的个人信息
  domain: 训练数据
  roles: [A]
  risk: high
  trigger: 训练语料包含个人信息
  question: 是否取得个人同意或符合法定情形，是否做去标识化处理？
  pass_criteria: >
    有个人信息识别与剔除机制；确需使用的，取得单独同意或具备《个人信息保护法》
    第13条其他合法性基础；完成去标识化并留存处理记录
  evidence_required:
    - 个人信息识别与清洗记录
    - 同意记录或合法性基础说明
    - 去标识化/匿名化技术说明
    - 个人信息保护影响评估报告（如适用）
  on_fail: 停止使用相关语料，或补齐合法性基础与去标识化
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第7条第3项
      quote_type: 原文
      quote: 涉及个人信息的，应当取得个人同意或者符合法律、行政法规规定的其他情形。
      effective_from: 2023-08-15
    - law: 中华人民共和国个人信息保护法
      article: 第13条
      quote_type: 概括
      quote: 处理个人信息应具备合法性基础，包括取得同意、订立履行合同所必需、履行法定职责或义务、应对突发公共卫生事件、合理处理已公开个人信息等。
      effective_from: 2021-11-01
  pitfalls:
    - 用"已公开"作为万能合法性基础（第13条对已公开信息仍有"合理范围"限制）
    - 去标识化不彻底，仍可重识别

- id: GEN-09
  title: 数据标注规范
  domain: 训练数据
  roles: [A]
  risk: medium
  trigger: 研发过程中开展数据标注
  question: 是否制定并执行了清晰、具体、可操作的标注规则，是否做质量评估与人员培训？
  pass_criteria: 有书面标注规则、抽样核验记录（含准确率）、标注人员培训记录
  evidence_required:
    - 标注规则文档
    - 抽样核验记录与准确率数据
    - 标注人员培训记录
  on_fail: 补齐标注规则、抽检机制与培训记录
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第8条
      quote_type: 原文
      quote: >
        在生成式人工智能技术研发过程中进行数据标注的，提供者应当制定符合本办法
        要求的清晰、具体、可操作的标注规则；开展数据标注质量评估，抽样核验标注
        内容的准确性；对标注人员进行必要培训，提升尊法守法意识，监督指导标注
        人员规范开展标注工作。
      effective_from: 2023-08-15
  pitfalls:
    - 有规则无抽检记录
    - 外包标注团队无培训留痕

# ============================================================
# 域三 · 内容安全
# ============================================================

- id: GEN-10
  title: 红线内容防控
  domain: 内容安全
  roles: [A, B, C]
  risk: high
  trigger: 提供生成或传播服务
  question: 是否采取有效措施防止生成法律、行政法规禁止的内容？
  pass_criteria: 有输入输出双向过滤、关键词库、拒答策略，且有测试验证记录
  evidence_required:
    - 内容安全策略说明
    - 关键词库/特征库清单
    - 红线测试集与通过率
  on_fail: 上线前补齐拦截能力；未达标不得开放生成功能
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第4条第1项
      quote_type: 原文
      quote: >
        坚持社会主义核心价值观，不得生成煽动颠覆国家政权、推翻社会主义制度，
        危害国家安全和利益、损害国家形象，煽动分裂国家、破坏国家统一和社会稳定，
        宣扬恐怖主义、极端主义，宣扬民族仇恨、民族歧视，暴力、淫秽色情，
        以及虚假有害信息等法律、行政法规禁止的内容。
      effective_from: 2023-08-15
  pitfalls:
    - 只做输入端拦截，输出端靠模型自觉
    - 关键词库长期不更新

- id: GEN-11
  title: 歧视性输出防控
  domain: 内容安全
  roles: [A, B]
  risk: medium
  trigger: 全部生成式服务
  question: 在算法设计、训练数据选择、模型生成与优化、服务提供各环节，是否采取措施防止产生歧视？
  pass_criteria: 有偏见测试集与评测记录；对已知歧视性问题有缓解措施
  evidence_required:
    - 偏见/公平性评测方案与结果
    - 训练数据分布说明
    - 已发现问题的缓解措施
  on_fail: 建立偏见评测机制并修复高风险场景
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第4条第2项
      quote_type: 原文
      quote: >
        在算法设计、训练数据选择、模型生成和优化、提供服务等过程中，
        采取有效措施防止产生民族、信仰、国别、地域、性别、年龄、职业、健康等歧视。
      effective_from: 2023-08-15
  pitfalls:
    - 完全没有偏见评测，报告里写"已关注"
    - 只测性别，漏掉地域、职业、健康

- id: GEN-12
  title: 内容审核、特征库与日志
  domain: 内容安全
  roles: [A, B, C]
  risk: high
  trigger: 提供深度合成/生成式服务
  question: 是否以技术或人工方式审核输入数据与合成结果，是否建立违法不良信息特征库并留存网络日志？
  pass_criteria: 审核覆盖输入与输出；特征库有入库标准与更新机制；日志可追溯且留存期符合要求
  evidence_required:
    - 审核流程说明（人工/机器比例）
    - 特征库清单与更新记录
    - 日志留存策略与样例
  on_fail: 补齐审核链路与日志留存
  legal_basis:
    - law: 互联网信息服务深度合成管理规定
      article: 第10条
      quote_type: 原文
      quote: >
        深度合成服务提供者应当加强深度合成内容管理，采取技术或者人工方式对
        深度合成服务使用者的输入数据和合成结果进行审核。
        深度合成服务提供者应当建立健全用于识别违法和不良信息的特征库，完善入库标准、
        规则和程序，记录并留存相关网络日志。
      effective_from: 2023-01-10
  pitfalls:
    - 日志留存期不足（网络安全法要求不少于六个月）
    - 特征库无入库标准，随意添加

- id: GEN-13
  title: 违法内容处置、报告与辟谣
  domain: 内容安全
  roles: [A, B, C]
  risk: high
  trigger: 发现违法内容或用户违法使用
  question: 是否有停止生成/传输/消除、模型优化整改、向主管部门报告、对用户处置、辟谣的完整闭环？
  pass_criteria: 有书面处置流程、责任人、报告路径、留痕记录；有可演练的应急机制
  evidence_required:
    - 内容处置 SOP
    - 历史处置记录（如有）
    - 报告渠道与联系人
    - 辟谣机制说明
  on_fail: 建立处置与报告闭环，明确责任人与时限
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第14条
      quote_type: 原文
      quote: >
        提供者发现违法内容的，应当及时采取停止生成、停止传输、消除等处置措施，
        采取模型优化训练等措施进行整改，并向有关主管部门报告。
        提供者发现使用者利用生成式人工智能服务从事违法活动的，应当依法依约采取
        警示、限制功能、暂停或者终止向其提供服务等处置措施，保存有关记录，
        并向有关主管部门报告。
      effective_from: 2023-08-15
    - law: 互联网信息服务深度合成管理规定
      article: 第11条
      quote_type: 原文
      quote: 深度合成服务提供者应当建立健全辟谣机制，发现利用深度合成服务制作、复制、发布、传播虚假信息的，应当及时采取辟谣措施，保存有关记录，并向网信部门和有关主管部门报告。
      effective_from: 2023-01-10
  pitfalls:
    - 只有"删除"一个动作，没有整改与报告
    - 无辟谣机制（深度合成服务特有义务）

# ============================================================
# 域四 · 标识与透明度
# ============================================================

- id: GEN-14
  title: 显式标识
  domain: 标识与透明度
  roles: [A, B]
  risk: high
  trigger: 提供的生成合成服务属于《深度合成管理规定》第17条第1款情形（可能导致公众混淆或误认）
  question: 文本/音频/图片/视频/虚拟场景，是否在用户可明显感知的位置添加了标识？下载、复制、导出时是否保留？
  pass_criteria: >
    按模态逐一核验：文本（起始/末尾/中间或界面周边）、音频（语音或节奏提示）、
    图片（适当位置）、视频（起始画面 + 播放周边）、虚拟场景（起始画面）；
    导出文件仍含标识
  evidence_required:
    - 各模态产品截图
    - 导出/下载后的文件样本
    - 标识样式规范说明
  on_fail: 上线前补齐各模态显式标识；导出链路单独验证
  legal_basis:
    - law: 人工智能生成合成内容标识办法
      article: 第4条
      quote_type: 原文
      quote: >
        服务提供者提供的生成合成服务属于《互联网信息服务深度合成管理规定》
        第十七条第一款情形的，应当按照下列要求对生成合成内容添加显式标识：
        （一）在文本的起始、末尾或者中间适当位置添加文字提示或者通用符号提示等标识……
        （二）在音频的起始、末尾或者中间适当位置添加语音提示或者音频节奏提示等标识……
        （三）在图片的适当位置添加显著的提示标识；
        （四）在视频起始画面和视频播放周边的适当位置添加显著的提示标识……
        （五）呈现虚拟场景时，在起始画面的适当位置添加显著的提示标识……
        服务提供者提供生成合成内容下载、复制、导出等功能时，应当确保文件中含有
        满足要求的显式标识。
      effective_from: 2025-09-01
  pitfalls:
    - 只做界面角标，导出的文件是干净的
    - 只做文本，漏掉音频/视频/虚拟场景
    - 标识位置在折叠区域，不构成"显著"

- id: GEN-15
  title: 隐式标识（元数据）
  domain: 标识与透明度
  roles: [A, B]
  risk: high
  trigger: 生成合成内容以文件形式存在
  question: 文件元数据中是否写入生成合成内容属性信息、服务提供者名称或编码、内容编号？
  pass_criteria: 用元数据工具读取导出文件，能读到上述三类要素；建议叠加数字水印
  evidence_required:
    - 元数据读取结果（exiftool 等）
    - 技术实现说明
    - 水印方案（如有）
  on_fail: 在文件写入阶段补齐元数据标识
  legal_basis:
    - law: 人工智能生成合成内容标识办法
      article: 第5条
      quote_type: 原文
      quote: >
        服务提供者应当按照《互联网信息服务深度合成管理规定》第十六条的规定，
        在生成合成内容的文件元数据中添加隐式标识，隐式标识包含生成合成内容属性信息、
        服务提供者名称或者编码、内容编号等制作要素信息。
        鼓励服务提供者在生成合成内容中添加数字水印等形式的隐式标识。
      effective_from: 2025-09-01
    - law: 互联网信息服务深度合成管理规定
      article: 第16条
      quote_type: 原文
      quote: 深度合成服务提供者对使用其服务生成或者编辑的信息内容，应当采取技术措施添加不影响用户使用的标识，并依照法律、行政法规和国家有关规定保存日志信息。
      effective_from: 2023-01-10
  pitfalls:
    - 前端加了水印就认为完成，元数据为空
    - 转码/压缩后元数据丢失，未做保留处理

- id: GEN-16
  title: 标识条款入协议与无标识导出的日志留存
  domain: 标识与透明度
  roles: [A, B]
  risk: medium
  trigger: 全部生成式服务；以及提供"无显式标识"版本
  question: 用户协议是否明确说明标识方法、样式与用户义务？提供无显式标识内容时，是否明确用户责任并留存日志不少于六个月？
  pass_criteria: 协议有专条说明标识；无标识导出有协议约定、身份核验、日志留存 ≥ 6 个月
  evidence_required:
    - 用户协议相关条款截图
    - 无标识导出的功能说明与日志留存方案
  on_fail: 补充协议条款；无标识导出功能未落实日志留存的，暂停该功能
  legal_basis:
    - law: 人工智能生成合成内容标识办法
      article: 第8条
      quote_type: 原文
      quote: 服务提供者应当在用户服务协议中明确说明生成合成内容标识的方法、样式等规范内容，并提示用户仔细阅读并理解相关的标识管理要求。
      effective_from: 2025-09-01
    - law: 人工智能生成合成内容标识办法
      article: 第9条
      quote_type: 原文
      quote: 用户申请服务提供者提供没有添加显式标识的生成合成内容的，服务提供者可以在通过用户协议明确用户的标识义务和使用责任后，提供不含显式标识的生成合成内容，并依法留存提供对象信息等相关日志不少于六个月。
      effective_from: 2025-09-01
  pitfalls:
    - 协议里没有标识条款（最常见）
    - 提供无水印导出但没有日志，或留存期不足六个月

- id: GEN-17
  title: 传播平台核验义务
  domain: 标识与透明度
  roles: [C]
  risk: high
  trigger: 提供网络信息内容传播服务
  question: 是否核验文件元数据中的隐式标识？未核验到但用户声明、或检测到显式标识/生成痕迹的，是否加提示？是否提供用户主动声明功能？
  pass_criteria: >
    四条路径均有实现：元数据命中 → 加提示；无元数据但用户声明 → 加提示；
    无元数据无声明但检测到痕迹 → 标注"疑似"；提供声明入口。
    三类情形均需在元数据中回写传播要素信息
  evidence_required:
    - 标识核验流程说明
    - 各类提示的界面截图
    - 用户声明入口截图
  on_fail: 补齐核验与提示链路；未实现前不得上线内容发布功能
  legal_basis:
    - law: 人工智能生成合成内容标识办法
      article: 第6条
      quote_type: 原文
      quote: >
        提供网络信息内容传播服务的服务提供者应当采取下列措施，规范生成合成内容传播活动：
        （一）核验文件元数据中是否含有隐式标识……采取适当方式在发布内容周边添加显著的提示标识；
        （二）文件元数据中未核验到隐式标识，但用户声明为生成合成内容的……添加显著的提示标识；
        （三）……检测到显式标识或者其他生成合成痕迹的，识别为疑似生成合成内容……添加显著的提示标识；
        （四）提供必要的标识功能，并提醒用户主动声明发布内容中是否包含生成合成内容。
      effective_from: 2025-09-01
  pitfalls:
    - 只做"用户自己勾选"，没做元数据核验
    - 提示语混同"AI 生成"与"疑似 AI 生成"，法律含义不同

- id: GEN-18
  title: 分发平台上架核验义务
  domain: 标识与透明度
  roles: [D]
  risk: medium
  trigger: 作为互联网应用程序分发平台（应用商店、小程序平台）
  question: 上架审核时是否要求开发者说明是否提供生成合成服务？是否核验其标识相关材料与备案、安全评估情况？
  pass_criteria: 上架问卷含该问题；有标识材料核验记录；有不予上架/下架的处置规则
  evidence_required:
    - 上架审核问卷与流程
    - 核验记录样例
    - 处置规则
  on_fail: 在上架流程中嵌入该问项与核验环节
  legal_basis:
    - law: 人工智能生成合成内容标识办法
      article: 第7条
      quote_type: 原文
      quote: 互联网应用程序分发平台在应用程序上架或者上线审核时，应当要求互联网应用程序服务提供者说明是否提供人工智能生成合成服务。互联网应用程序服务提供者提供人工智能生成合成服务的，互联网应用程序分发平台应当核验其生成合成内容标识相关材料。
      effective_from: 2025-09-01
    - law: 互联网信息服务深度合成管理规定
      article: 第13条
      quote_type: 原文
      quote: 互联网应用商店等应用程序分发平台应当落实上架审核、日常管理、应急处置等安全管理责任，核验深度合成类应用程序的安全评估、备案等情况；对违反国家有关规定的，应当及时采取不予上架、警示、暂停服务或者下架等处置措施。
      effective_from: 2023-01-10
  pitfalls:
    - 上架问卷没有这一项
    - 只核验备案号，不核验标识材料

# ============================================================
# 域五 · 个人信息与用户权益
# ============================================================

- id: GEN-19
  title: 输入信息与使用记录保护
  domain: 个人信息与用户权益
  roles: [A, B, C]
  risk: high
  trigger: 全部生成式服务
  question: 是否只收集必要个人信息？是否能识别用户身份的输入信息与使用记录被非法留存或向他人提供？
  pass_criteria: 有最小必要清单；输入内容不与身份标识强绑定存储，或做去标识化/加密隔离；有留存期限与删除策略
  evidence_required:
    - 个人信息收集清单与必要性说明
    - 存储架构说明（是否与账号绑定、加密方式）
    - 留存期限与删除机制
  on_fail: 停止非必要收集；对已留存数据做清理与去标识化
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第11条
      quote_type: 原文
      quote: >
        提供者对使用者的输入信息和使用记录应当依法履行保护义务，不得收集非必要
        个人信息，不得非法留存能够识别使用者身份的输入信息和使用记录，
        不得非法向他人提供使用者的输入信息和使用记录。
      effective_from: 2023-08-15
  pitfalls:
    - 为"改进模型"默认留存全部对话且与账号绑定
    - 隐私政策写了但技术实现没做

- id: GEN-20
  title: 真实身份信息认证
  domain: 个人信息与用户权益
  roles: [A, B, C]
  risk: medium
  trigger: 向使用者提供信息发布服务
  question: 是否基于手机号、身份证件号码、统一社会信用代码或国家网络身份认证公共服务完成真实身份信息认证？是否向未认证用户提供发布服务？
  pass_criteria: 发布功能前置认证；有认证方式说明与拦截验证
  evidence_required:
    - 认证流程说明
    - 未认证用户的功能限制截图
  on_fail: 对发布功能增加认证前置，否则关闭发布能力
  legal_basis:
    - law: 互联网信息服务深度合成管理规定
      article: 第9条
      quote_type: 原文
      quote: 深度合成服务提供者应当基于移动电话号码、身份证件号码、统一社会信用代码或者国家网络身份认证公共服务等方式，依法对深度合成服务使用者进行真实身份信息认证，不得向未进行真实身份信息认证的深度合成服务使用者提供信息发布服务。
      effective_from: 2023-01-10
  pitfalls:
    - 只有私域对话就不需要，但一旦有公开分享/发布就必须
    - 用邮箱注册即视为已认证

- id: GEN-21
  title: 未成年人保护
  domain: 个人信息与用户权益
  roles: [A, B, C]
  risk: medium
  trigger: 服务可能被未成年人使用
  question: 是否明确适用人群、场合、用途？是否采取有效措施防范未成年人过度依赖或沉迷？
  pass_criteria: 有适用人群声明；有未成年人模式/时长提示/内容分级等措施；有年龄识别或声明机制
  evidence_required:
    - 适用人群与场景说明
    - 防沉迷措施说明与截图
    - 未成年人个人信息处理规则
  on_fail: 补齐适用人群声明与防沉迷措施
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第10条
      quote_type: 原文
      quote: 提供者应当明确并公开其服务的适用人群、场合、用途，指导使用者科学理性认识和依法使用生成式人工智能技术，采取有效措施防范未成年人用户过度依赖或者沉迷生成式人工智能服务。
      effective_from: 2023-08-15
    - law: 未成年人网络保护条例
      article: 相关规定
      quote_type: 概括
      quote: 未成年人网络保护条例（2024-01-01 施行）对网络产品和服务提供者提出未成年人模式、个人信息保护、防沉迷等要求。
      effective_from: 2024-01-01
  pitfalls:
    - 协议里写"未成年人需在监护人指导下使用"就算完成
    - 无任何时长提醒或使用限制

# ============================================================
# 域六 · 服务运营
# ============================================================

- id: GEN-22
  title: 服务协议与责任分配
  domain: 服务运营
  roles: [A, B]
  risk: medium
  trigger: 向使用者提供服务
  question: 是否与使用者签订服务协议，明确双方权利义务、适用人群场合用途、禁止性行为？
  pass_criteria: 协议可获取、可留存；含权责条款、使用规范、违约处置、标识条款
  evidence_required:
    - 用户协议与隐私政策文本
    - 注册流程中的同意留痕
  on_fail: 补齐协议与同意留痕
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第9条
      quote_type: 原文
      quote: 提供者应当与注册其服务的生成式人工智能服务使用者（以下称使用者）签订服务协议，明确双方权利义务。
      effective_from: 2023-08-15
  pitfalls:
    - 协议是通用模板，未覆盖生成式服务特有条款
    - 无同意留痕（无法证明用户已同意）

- id: GEN-23
  title: 投诉举报机制与服务连续性
  domain: 服务运营
  roles: [A, B, C]
  risk: medium
  trigger: 全部服务
  question: 是否设置便捷的投诉举报入口，公布处理流程与反馈时限？是否保障服务安全、稳定、持续？
  pass_criteria: 产品内有可到达的入口；流程与时限公开；有可用性与故障响应机制
  evidence_required:
    - 投诉举报入口截图
    - 处理流程与时限说明
    - 服务可用性监控与应急预案
  on_fail: 补齐入口、流程公示与应急机制
  legal_basis:
    - law: 生成式人工智能服务管理暂行办法
      article: 第15条
      quote_type: 原文
      quote: 提供者应当建立健全投诉、举报机制，设置便捷的投诉、举报入口，公布处理流程和反馈时限，及时受理、处理公众投诉举报并反馈处理结果。
      effective_from: 2023-08-15
    - law: 生成式人工智能服务管理暂行办法
      article: 第13条
      quote_type: 原文
      quote: 提供者应当在其服务过程中，提供安全、稳定、持续的服务，保障用户正常使用。
      effective_from: 2023-08-15
  pitfalls:
    - 只有邮箱，无处理时限
